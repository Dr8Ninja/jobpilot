# Verified job-board registry.
#
# Every token below was probed against its provider's public API on 2026-07-26 and returned at least one live posting. Nothing here is guessed.
#
# Providers are all documented, public, unauthenticated JSON endpoints:
#   greenhouse       boards-api.greenhouse.io
#   lever            api.lever.co
#   ashby            api.ashbyhq.com/posting-api
#   workable         apply.workable.com/api/v1/widget
#   smartrecruiters  api.smartrecruiters.com
#
# Tokens go stale as companies migrate ATS vendors. A dead token is logged and
# skipped, never fatal. Re-probe periodically and prune.
#
# Load with: jobpilot seed-companies infra/seed_companies.yaml   (idempotent)

