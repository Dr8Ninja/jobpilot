[project]
name = "jobpilot"
version = "0.1.0"
description = "Personal job-hunt assist platform (Phase 0)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "typer>=0.12",
    "pdfplumber>=0.11",
    "weasyprint>=62",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=2.48.0",
]

[project.scripts]
jobpilot = "jobpilot_api.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/shared/jobpilot_shared",
    "services/api/jobpilot_api",
    "services/worker/jobpilot_worker",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as argument defaults; that is the documented API.
"services/api/jobpilot_api/cli.py" = ["B008"]
# FastAPI declares dependencies as argument defaults; that is the documented API.
"services/api/jobpilot_api/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
